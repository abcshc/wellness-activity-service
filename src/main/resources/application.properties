spring.application.name=wellness-activity-service
app.security.jwt.issuer=${APP_SECURITY_JWT_ISSUER}
app.security.jwt.secret=${APP_SECURITY_JWT_SECRET}
spring.datasource.url=${MYSQL_JDBC_URL:jdbc:mysql://localhost:${MYSQL_PORT:3306}/wellness_activity?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul}
spring.datasource.username=${MYSQL_USERNAME:wellness}
spring.datasource.password=${MYSQL_PASSWORD:wellness}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.out-of-order=false
