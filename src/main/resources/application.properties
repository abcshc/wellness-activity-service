spring.application.name=wellness-activity-service
app.security.jwt.issuer=${APP_SECURITY_JWT_ISSUER}
app.security.jwt.secret=${APP_SECURITY_JWT_SECRET}
spring.datasource.url=jdbc:h2:mem:wellness_activity;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.out-of-order=false
